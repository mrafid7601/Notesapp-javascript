<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App Using Java Script</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="container">
        <div class="content mt-5 p-3">
            <form action="" class="form p-3 card" id="notesapp">
                <h2><b><u>NOTESAPP:</u></b></h2>
                <hr>
                <input type="text" class="form-control m-2" placeholder="Enter Title" id="title">
                <textarea class="form-control m-2" cols="6" rows="8" placeholder="Enter Your Message"
                    id="message"></textarea>
                <button class="btn btn-info">Enter</button>
            </form>

        </div>
    </div>

    <div class="container card pt-4">
        <h2><b><u>All Data Preview:</u></b></h2>
        <div class="preview row justify-content-left" id="preview">

            

        </div>

    </div>

</body>
<script src="./script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
